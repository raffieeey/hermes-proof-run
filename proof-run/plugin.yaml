name: proof-run
requires_hermes: ">=0.21.0"
version: "0.3.2"
description: "Record a task once, save it as a procedure with inputs, and run it with a cheaper model that is guided and checked step by step. Strict exact guards and checked-execution workflows remain. Guided runs make no model-inference or network requests; the separate workflow backend can use local Ollama over loopback HTTP."
entry: __init__.py
author: raffieeey
license: MIT
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - on_session_finalize
provides_tools: []
provides_middleware: []
